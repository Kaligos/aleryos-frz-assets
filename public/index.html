<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FRZ Assets</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #080c12;
      color: white;
      font-family: system-ui, sans-serif;
    }

    h1 {
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: #111821;
      border: 1px solid #293442;
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      display: block;
    }

    .info {
      padding: 16px;
    }

    .url {
      font-family: monospace;
      font-size: 12px;
      color: #9fb3c8;
      word-break: break-all;
      margin: 10px 0;
    }

    button {
      background: #1e90ff;
      color: white;
      border: 0;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>FRZ Ship Assets</h1>

<div id="ships" class="grid"></div>

<script>
const ships = [
  "frz_01_raptor.webp",
  "frz_02_viper.webp",
  "frz_03_wraith.webp",
  "frz_04_hornet.webp",
  "frz_05_orion.webp",
  "frz_06_bastion.webp",
  "frz_07_sentinel.webp",
  "frz_08_valkyrie.webp",
  "frz_09_nomad.webp",
  "frz_10_aurora.webp",
  "frz_11_titan.webp",
  "frz_12_helios.webp"
];

const container = document.getElementById("ships");

ships.forEach(file => {

  const url = new URL(`ships/${file}`, window.location.href).href;

  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <a href="${url}" target="_blank">
      <img src="ships/${file}" loading="lazy">
    </a>

    <div class="info">
      <strong>${file}</strong>

      <div class="url">${url}</div>

      <button onclick="navigator.clipboard.writeText('${url}')">
        Copier l'URL
      </button>
    </div>
  `;

  container.appendChild(card);
});
</script>

</body>
</html>
